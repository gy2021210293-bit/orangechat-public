name: Plugin Runtime Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/plugin-runtime-foundation
    paths:
      - 'app/**'
      - 'ai/**'
      - 'common/**'
      - 'document/**'
      - 'highlight/**'
      - 'material3/**'
      - 'search/**'
      - 'speech/**'
      - 'web/**'
      - 'web-ui/**'
      - 'workspace/**'
      - 'plugins/example/runtime-wake-test/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/plugin-runtime-debug.yml'

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Material Color Utilities submodule
        run: git submodule update --init material3/material-color-utilities

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm and web UI dependencies
        run: |
          npm install --global pnpm@10.15.0
          pnpm --version
          cd web-ui
          pnpm install --frozen-lockfile

      - name: Prepare shared debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Give phone-test APK a standalone package id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8-sig')
          old = 'debug {\n            applicationIdSuffix = ".debug"'
          new = 'debug {\n            applicationIdSuffix = ".pluginruntime"'
          if old not in s:
              raise SystemExit('Debug applicationIdSuffix block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -n 'applicationIdSuffix' app/build.gradle.kts

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare phone test package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK=$(find app/build/outputs/apk -type f -name '*universal*debug*.apk' | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo 'No debug APK found'
            find app/build/outputs/apk -type f || true
            exit 1
          fi

          cp "$APK" dist/OrangeChat-plugin-runtime-test-debug.apk
          (
            cd plugins/example/runtime-wake-test
            zip -j "$GITHUB_WORKSPACE/dist/runtime-wake-test.zip" manifest.json main.js
          )

          cat > dist/PHONE_TEST_README.txt <<'EOF'
          OrangeChat 插件运行时手机测试

          1. 安装 OrangeChat-plugin-runtime-test-debug.apk。
             该测试包使用独立 applicationId：me.rerere.orangechat.pluginruntime，应用显示名保持不变，可与原 App 并存。
          2. 在测试 App 中先配置一个可正常聊天的 AI 模型/助手。
          3. 导入 runtime-wake-test.zip，并确认插件已启用、允许 ai_chat 权限。
          4. 保持插件启用。测试插件按 */5 * * * * 运行，即每 5 分钟一个计划点。
          5. 成功时，AI 会在正常聊天记录里主动发出：插件自主唤醒测试成功。
          6. 若手机限制后台闹钟，请给测试 App 允许“闹钟和提醒/精确闹钟”，并关闭电池优化后再测。
          EOF

          ls -lh dist

      - name: Upload phone test package
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-plugin-runtime-phone-test
          path: dist/*
          if-no-files-found: error
          retention-days: 7
